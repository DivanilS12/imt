<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMT | Cadastro</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="index.html">
      <span class="brand-mark">IMT</span>
      <span><strong>Intelligent Market Tracker</strong><small>Crie seu perfil</small></span>
    </a>
    <form class="form-stack" data-form="register">
      <label>Nome<input type="text" name="nome" required minlength="2" placeholder="Seu nome"></label>
      <label>Email<input type="email" name="email" required placeholder="voce@email.com"></label>
      <label>Senha<input type="password" name="senha" required minlength="8" placeholder="Mínimo de 8 caracteres"></label>
      <button class="btn btn-primary btn-wide" type="submit">Cadastrar</button>
      <p class="form-note">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </main>
  <script src="assets/js/main.js"></script>
</body>
</html>
